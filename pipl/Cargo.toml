[package]
name = "exaecut-pipl"
version = "0.2.0"
authors = [
    "Adrian Eddy <adrian.eddy@gmail.com>",
    "Marvin Cano <marvin.cano@exaecut.io>",
]
edition = "2024"
license = "MIT OR Apache-2.0"
exclude = ["tests"]
description = "Library for building Adobe's PiPL plugin info resource — Exaecut fork"
keywords = ["motion-graphics", "adobe", "after-effects", "premiere", "plugins"]
categories = ["graphics", "multimedia::video", "rendering::graphics-api"]
repository = "https://github.com/Exaecut/after-effects/"

[lib]
# Preserve the `use pipl::...` path so dependents (build.rs of every effect)
# don't need to change.
name = "pipl"

[dependencies]
bitflags = "2.11"
byteorder = "1.5"
pretty-hex = "0.4"
winres = "0.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
plist = "1.8.0"

[dev-dependencies]
pretty-hex = "0.4"
similar-asserts = "2.0.0"
