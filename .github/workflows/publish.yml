name: Publish exaecut-* to crates.io

on:
  push:
    branches: [main, master]
    paths:
      - 'after-effects/Cargo.toml'
      - 'after-effects-sys/Cargo.toml'
      - 'premiere/Cargo.toml'
      - 'premiere-sys/Cargo.toml'
      - 'pipl/Cargo.toml'
  workflow_dispatch: # manual "publish everything that's bumped" trigger

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish changed crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Publish crates whose on-disk version isn't on crates.io yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          version_of() {
            local file="$1"
            awk -F'"' '/^version = "/ { print $2; exit }' "$file"
          }

          already_published() {
            local pkg="$1" version="$2"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$pkg/$version")
            [[ "$code" == "200" ]]
          }

          publish_if_needed() {
            local pkg="$1" manifest_path="$2"
            local v
            v=$(version_of "$manifest_path" || true)
            if [[ -z "$v" ]]; then
              echo "::warning::$pkg: no version in $manifest_path, skipping"
              return 0
            fi
            if already_published "$pkg" "$v"; then
              echo "$pkg v$v: already on crates.io, skipping"
              return 0
            fi
            echo "::notice::Publishing $pkg v$v"
            cargo publish -p "$pkg" --allow-dirty \
              || cargo_publish_retry "$pkg" "$v"
          }

          cargo_publish_retry() {
            local pkg="$1" version="$2"
            local attempt
            for attempt in 2 3 4; do
              echo "::warning::$pkg v$version publish attempt $attempt after 60s sleep"
              sleep 60
              if already_published "$pkg" "$version"; then
                echo "$pkg v$version: landed on crates.io between attempts, skipping"
                return 0
              fi
              if cargo publish -p "$pkg" --allow-dirty; then
                return 0
              fi
            done
            echo "::error::$pkg v$version publish failed after 4 attempts"
            return 1
          }

          # Order: -sys crates first, then high-level crates that depend on
          # them, then pipl (independent — any order works).
          publish_if_needed exaecut-after-effects-sys after-effects-sys/Cargo.toml
          publish_if_needed exaecut-premiere-sys      premiere-sys/Cargo.toml

          # Let the crates.io sparse index catch up before resolving the
          # high-level deps.
          sleep 60

          publish_if_needed exaecut-after-effects after-effects/Cargo.toml
          publish_if_needed exaecut-premiere      premiere/Cargo.toml
          publish_if_needed exaecut-pipl          pipl/Cargo.toml
